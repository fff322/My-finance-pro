<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Мои Финансы — Таблица</title>
</head>
<body>
<header>
  <div>
    <h1>Мои Финансы</h1>
    <div class="sub">Учёт доходов и расходов — как в таблице</div>
  </div>
  <button id="themeBtn" class="iconbtn" title="Тема">☾</button>
</header>

<section class="summary">
  <div class="card"><span>Доходы</span><b id="income">0</b></div>
  <div class="card"><span>Расходы</span><b id="expense">0</b></div>
  <div class="card balance"><span>Баланс</span><b id="balance">0</b></div>
</section>

<section class="toolbar">
  <button class="primary" id="addBtn">＋ Добавить строку</button>
  <button id="exportBtn">⇩ Экспорт</button>
  <button id="importBtn">⇧ Импорт</button>
  <input type="file" id="fileInput" accept=".json" hidden>
</section>

<section class="filters">
  <input id="search" placeholder="Поиск по описанию...">
  <select id="month"><option value="all">Все месяцы</option></select>
  <select id="typeFilter"><option value="all">Все операции</option><option>Доход</option><option>Расход</option></select>
  <select id="accountFilter"><option value="all">Все счета</option></select>
</section>

<main class="tableWrap">
<table>
<thead>
<tr>
<th>Дата</th><th>Тип</th><th>Категория</th><th>Описание</th><th>Сумма</th><th>Счёт</th><th>Способ</th><th></th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
<div id="empty" class="empty">Пока нет операций. Нажми «Добавить строку».</div>
</main>

<section class="bottom">
  <div><span>Операций</span><b id="count">0</b></div>
  <div><span>За выбранный период</span><b id="periodBalance">0</b></div>
</section>

<dialog id="dlg">
<form method="dialog" id="form">
<h2 id="dlgTitle">Новая операция</h2>
<div class="grid">
<label>Дата<input type="date" id="date" required></label>
<label>Тип<select id="type"><option>Расход</option><option>Доход</option></select></label>
<label>Категория<select id="category"></select></label>
<label>Описание<input id="description" placeholder="Например: продукты"></label>
<label>Сумма<input id="amount" type="number" min="0" step="0.01" required></label>
<label>Счёт<select id="account"></select></label>
<label>Способ<select id="method"><option>Карта</option><option>Наличные</option><option>Перевод</option><option>Другое</option></select></label>
</div>
<div class="actions"><button value="cancel">Отмена</button><button class="primary" value="default">Сохранить</button></div>
</form>
</dialog>

<script src="app.js"></script>
</body>
</html>
